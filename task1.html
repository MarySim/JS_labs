<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 1: Интересные факты</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #4baed4; margin: 0; padding: 20px; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); border-radius: 15px; padding: 30px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.2); max-width: 500px; width: 100%; border: 1px solid rgba(255,255,255,0.2); }
        h1, h2 { margin-top: 0; }
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        button { background: white; color: #333; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 25px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:hover { background: #f0f0f0; transform: translateY(-2px); }
        .hidden { display: none; }
        img { max-width: 100%; max-height: 300px; border-radius: 10px; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .fact-text { font-size: 18px; margin-top: 15px; font-style: italic; line-height: 1.4; }
        .translation { font-size: 16px; margin-top: 10px; color: #e0f7fa; font-weight: bold; }
        .loader { border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 4px solid white; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="screen-welcome" class="card">
        <h1>Добро пожаловать, странник!</h1>
        <p id="name-prompt">Загрузка случайного имени...</p>
        <div class="btn-group">
            <button id="btn-accept" onclick="goToAnimals()" disabled>Ладно...</button>
            <button id="btn-reject" onclick="generateNickname()">А может не надо?..</button>
        </div>
    </div>

    <div id="screen-choice" class="card hidden">
        <h2>На чьей ты стороне?</h2>
        <div class="btn-group">
            <button onclick="fetchAnimalData('dog')">Собаки</button>
            <button onclick="fetchAnimalData('cat')">Коты</button>
            <button onclick="fetchAnimalData('fox')">Лисы (???)</button>
        </div>
    </div>

    <div id="screen-result" class="card hidden">
        <h2 id="result-title">Случайный факт</h2>
        <div id="result-loader" class="loader hidden"></div>
        <div id="result-content">
            <img id="animal-img" src="" alt="Изображение животного" referrerpolicy="no-referrer">
            <p class="fact-text" id="animal-fact-en"></p>
            <p class="translation" id="animal-fact-ru"></p>
        </div>
        <div class="btn-group">
            <button onclick="backToChoice()">Назад</button>
            <button id="btn-refresh-animal">Еще один факт</button>
        </div>
    </div>

    <script>
        let currentAnimal = '';

        // Функция инициализации при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            generateNickname();
        });

        // 1. Генерация случайного имени через стабильное публичное API (randomuser)
        async function generateNickname() {
            const promptText = document.getElementById('name-prompt');
            const acceptBtn = document.getElementById('btn-accept');
            promptText.textContent = "Придумываю тебе имя...";
            acceptBtn.disabled = true;

            try {
                // Используем надежное API без ограничений CORS
                const response = await fetch('https://randomuser.me/api/');
                const data = await response.json();
                const user = data.results[0];
                
                // Создаем забавное имя на основе никнейма и страны
                const funnyName = user.login.username.charAt(0).toUpperCase() + user.login.username.slice(1);
                promptText.innerHTML = `Я буду звать тебя <b>${funnyName}</b>, ok?`;
                acceptBtn.disabled = false;
            } catch (error) {
                console.error("Ошибка API имен:", error);
                promptText.innerHTML = `Я буду звать тебя <b>Stranik_JS</b>, ok?`;
                acceptBtn.disabled = false;
            }
        }

        function goToAnimals() {
            document.getElementById('screen-welcome').classList.add('hidden');
            document.getElementById('screen-choice').classList.remove('hidden');
        }

        function backToChoice() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-choice').classList.remove('hidden');
        }

        // 2. Получение данных о животном и интеграция переводчика
        async function fetchAnimalData(animal) {
            currentAnimal = animal;
            document.getElementById('screen-choice').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            
            const loader = document.getElementById('result-loader');
            const content = document.getElementById('result-content');
            
            loader.classList.remove('hidden');
            content.classList.add('hidden');

            try {
                // Запрос к актуальному зеркалу Some Random API
                const response = await fetch(`https://some-random-api.com/animal/${animal}`);
                const data = await response.json();

                // Установка картинки
                document.getElementById('animal-img').src = data.image;
                document.getElementById('animal-fact-en').textContent = data.fact;

                // Перевод факта с помощью бесплатного MyMemory API
                const translateUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(data.fact)}&langpair=en|ru`;
                const transResponse = await fetch(translateUrl);
                const transData = await transResponse.json();
                
                document.getElementById('animal-fact-ru').textContent = transData.responseData.translatedText;
                
                // Переопределяем поведение кнопки повтора
                document.getElementById('btn-refresh-animal').onclick = () => fetchAnimalData(animal);

            } catch (error) {
                console.error("Ошибка загрузки данных о животном:", error);
                document.getElementById('animal-fact-en').textContent = "Failed to load interesting fact.";
                document.getElementById('animal-fact-ru').textContent = "Не удалось загрузить данные. Попробуйте снова.";
            } finally {
                loader.classList.add('hidden');
                content.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
