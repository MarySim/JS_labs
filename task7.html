<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменение свойств горизонтальной линии</title>
    <style>
        table { border-collapse: collapse; margin-top: 15px; }
        td { padding: 15px; vertical-align: top; }
    </style>
</head>
<body>
    <h2>Горизонтальные линии</h2>
    <p>Выберите значения параметров, которые требуется изменить, и нажмите кнопку Выполнить.</p>
    
    <hr id="targetLine" style="width: 270px; height: 25px; background-color: teal; border: none; margin: 10px auto;">

    <form id="lineForm">
        <table border="1">
            <tr>
                <td>
                    <b>Выравнивание</b><br>
                    <input type="radio" name="alignment" value="left"> LEFT<br>
                    <input type="radio" name="alignment" value="center" checked> CENTER<br>
                    <input type="radio" name="alignment" value="right"> RIGHT<br><br>
                    
                    <input type="text" id="lineSize" value="25" size="5"> толщина линии (size)<br><br>
                    <input type="text" id="lineWidth" value="270" size="5"> длина линии (width)
                </td>
                <td>
                    <b>Цвет линии (color)</b><br>
                    <select id="lineColor" size="11" style="width: 120px;">
                        <option value="teal" selected>teal</option>
                        <option value="green">green</option>
                        <option value="olive">olive</option>
                        <option value="navy">navy</option>
                        <option value="purple">purlered</option>
                        <option value="gray">gray</option>
                        <option value="silver">silver</option>
                        <option value="yellow">yellow</option>
                        <option value="blue">blue</option>
                        <option value="fuchsia">fuchsia</option>
                        <option value="white">white</option>
                    </select>
                </td>
            </tr>
        </table>
        <br>
        <button type="button" onclick="updateLineProperties()">Выполнить</button>
        <button type="reset" onclick="setTimeout(updateLineProperties, 10)">Обновить</button>
    </form>

    <script>
    function updateLineProperties() {
        const line = document.getElementById('targetLine');
        
        // Получаем значения из элементов формы
        const size = document.getElementById('lineSize').value;
        const width = document.getElementById('lineWidth').value;
        const color = document.getElementById('lineColor').value;
        const align = document.querySelector('input[name="alignment"]:checked').value;
        
        // Применяем толщину, длину и цвет
        line.style.height = size + 'px';
        line.style.width = width + 'px';
        line.style.backgroundColor = color;
        
        // Реализация выравнивания через CSS-отступы (margins)
        if (align === 'left') {
            line.style.marginLeft = '0';
            line.style.marginRight = 'auto';
        } else if (align === 'right') {
            line.style.marginLeft = 'auto';
            line.style.marginRight = '0';
        } else {
            line.style.marginLeft = 'auto';
            line.style.marginRight = 'auto';
        }
    }
    </script>
</body>
</html>
