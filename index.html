<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа 5 - Асинхронность</title>
    <script src="./app.js"></script>
     <style>
        table { border-collapse: collapse; }
        td { border: 1px solid black; padding: 10px; text-align: center; font-family: monospace; }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>1:1</td><td>2:1</td><td>3:1</td><td>4:1</td><td>5:1</td><td>6:1</td>
        </tr>
        <tr>
            <td>1:2</td><td>2:2</td><td>3:2</td><td>4:2</td><td>5:2</td><td>6:2</td>
        </tr>
        <tr>
            <td>1:3</td><td>2:3</td><td>3:3</td><td>4:3</td><td>5:3</td><td>6:3</td>
        </tr>
        <tr>
            <td>1:4</td><td>2:4</td><td>3:4</td><td>4:4</td><td>5:4</td><td>6:4</td>
        </tr>
    </table>
    <ul id="dynamic-list"></ul>

    <script>
    function createDynamicList() {
        let count = parseInt(prompt("Количество пунктов списка:")); [cite, 65]
        if (isNaN(count) || count <= 0) return alert("Некорректное число");

        let ul = document.getElementById('dynamic-list'); [cite, 66]

        for (let i = 0; i < count; i++) {
            let content = prompt(`Введите текст для пункта №${i + 1}:`); [cite, 65]
            
            // Создаем элемент в памяти DOM 
            let li = document.createElement('li'); [cite, 66]
            li.textContent = content ? content : `Пункт ${i + 1}`; // Защита от пустой строки
            
            // Встраиваем элемент в дерево документа 
            ul.appendChild(li); [cite, 66]
        }
    }

    createDynamicList();
    </script>
</body>
</html>
